name: Deploy Next.js App via Compose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t lettting/ab-consul:latest -f my-app/Dockerfile my-app

      # 4️⃣ Log Docker image size
      - name: Log Docker image size
        run: |
          echo "Docker Image Size:"
          docker image inspect lettting/ab-consul:latest --format='{{.Size}}' | awk '{print $1/1024/1024 " MB"}'

      # 5️⃣ Show Docker image layers (optional but useful)
      - name: Show Docker layers
        run: docker history lettting/ab-consul:latest

      # 6️⃣ Push Docker image
      - name: Push Docker image
        run: docker push lettting/ab-consul:latest

      # 7️⃣ Setup SSH Agent for deployment
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      # 8️⃣ Deploy via Docker Compose on the server
      - name: Deploy via SSH and Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            cd ~/ab-consul &&
            docker-compose pull &&
            docker-compose up -d --force-recreate
          "